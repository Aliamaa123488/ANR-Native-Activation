[package]
name = "anr-native-activation"
version = "1.1.0"
description = "A lightweight installer and launcher for Apex Neural Rendering FG"
authors = ["ANR Native Activation"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
winreg = "0.52"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
